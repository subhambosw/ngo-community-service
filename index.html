<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CyberAware: Interactive Cybersecurity Education & Awareness Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root{--bg:#fff;--soft:#F6F7F9;--surface:#fff;--ink:#0F172A;--muted:#64748B;--line:#E2E8F0;--accent:#1D4ED8;--accent-soft:#EEF3FF;--good:#15803D;--bad:#B91C1C;--warn:#B45309;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1020;--soft:#111827;--surface:#0F172A;--ink:#F1F5F9;--muted:#94A3B8;--line:#1E293B;--accent:#7AA2FF;--accent-soft:#16213B;--good:#4ADE80;--bad:#F87171;--warn:#FBBF24;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1020;--soft:#111827;--surface:#0F172A;--ink:#F1F5F9;--muted:#94A3B8;--line:#1E293B;--accent:#7AA2FF;--accent-soft:#16213B;--good:#4ADE80;--bad:#F87171;--warn:#FBBF24;color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1,h2,h3{font-weight:600;letter-spacing:-.02em;line-height:1.15;margin:0}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:820px;margin:auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-weight:600;font-size:18px;letter-spacing:-.02em;margin-right:auto}
.brand span{color:var(--accent)}
nav{display:flex;gap:2px;overflow:visible}
nav button{font:inherit;font-size:14px;background:none;border:0;color:var(--muted);padding:6px 12px;border-radius:6px;cursor:pointer}
nav button:hover{color:var(--ink)}
nav button[aria-current="true"]{color:var(--ink);font-weight:600;background:var(--soft)}
.xp{font-size:13px;font-weight:500;color:var(--muted);background:var(--soft);border-radius:20px;padding:3px 12px;white-space:nowrap}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:820px;margin:auto;padding:56px 20px 80px}
.hero h1{font-size:clamp(34px,6vw,52px);letter-spacing:-.035em;line-height:1.08;max-width:17ch}
.hero p{max-width:54ch;color:var(--muted);font-size:18px;margin:16px 0 32px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.pw{display:flex;gap:8px;flex-wrap:wrap}
.pw input{flex:1;min-width:200px;font:inherit;font-size:17px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.pw input:focus{border-color:var(--accent)}
.btn{font:inherit;font-size:15px;font-weight:500;background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:10px;padding:10px 18px;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.alt:hover:not(:disabled){background:var(--soft);filter:none}
.meter{display:flex;gap:6px;margin:20px 0 10px}
.meter i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.time{font-size:28px;font-weight:600;letter-spacing:-.02em}
.checks{list-style:none;padding:0;margin:16px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:6px 16px;font-size:14px;color:var(--muted)}
.checks li::before{content:"○ ";color:var(--muted)}
.checks li.ok{color:var(--ink)}
.checks li.ok::before{content:"● ";color:var(--good)}
.note{color:var(--muted);font-size:14px;margin:6px 0 0}
h2{font-size:24px;margin:72px 0 6px}
.sub{color:var(--muted);margin:0 0 24px;max-width:58ch}
.mod{border-top:1px solid var(--line)}
.mod:last-child{border-bottom:1px solid var(--line)}
.mod>button{all:unset;box-sizing:border-box;width:100%;display:flex;gap:16px;align-items:center;padding:18px 2px;cursor:pointer}
.mod>button:hover .mt b{color:var(--accent)}
.mod>button:focus-visible{outline:2px solid var(--accent)}
.ico{display:none}
.mt{flex:1}.mt b{font-weight:600;font-size:17px;display:block}
.mt small{color:var(--muted);font-size:14px}
.tag{font-size:13px;color:var(--muted)}
.tag.done{color:var(--good);font-weight:500}
.body{padding:0 2px 24px;max-width:62ch}
.body ul{margin:0 0 16px;padding-left:20px;color:var(--muted)}.body li{margin:8px 0}
.try{background:var(--accent-soft);padding:12px 16px;border-radius:10px;margin:0 0 16px;font-size:15px}
.opt{display:block;width:100%;text-align:left;font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:13px 16px;margin:10px 0;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.fb{margin:16px 0;padding:14px 18px;border-radius:10px;background:var(--soft)}
.prog{height:4px;background:var(--line);border-radius:2px;margin-bottom:20px;overflow:hidden}.prog i{display:block;height:100%;background:var(--accent)}
.mail{border:1px solid var(--line);border-radius:12px;background:var(--soft);padding:18px 20px;margin-bottom:18px;overflow-wrap:anywhere}
.mail .f{font-size:14px;color:var(--muted)}.mail b{display:block;margin:4px 0 10px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:32px}
.stat{border:1px solid var(--line);border-radius:12px;padding:16px 18px;color:var(--muted);font-size:14px}
.stat b{font-size:28px;font-weight:600;color:var(--ink);letter-spacing:-.02em;display:block}
.badges{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.badge{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:14px 16px;color:var(--muted);font-size:14px}
.badge::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}
.badge b{font-size:15px;font-weight:600}
.badge.on{color:var(--muted);border-color:var(--accent);background:var(--accent-soft)}
.badge.on::before{background:var(--accent)}.badge.on b{color:var(--ink)}
footer{max-width:820px;margin:auto;padding:0 20px 36px;color:var(--muted);font-size:13px}
@media (max-width:560px){main{padding-top:36px}h2{margin-top:56px}}
:root{--bg:#F3F6FC;--soft:#E9EFFB;--surface:#fff;--ink:#0B1B3A;--muted:#52627F;--line:#D8E1F0;--accent:#4F46E5;--accent-soft:#ECEBFF;--teal:#0D9488;--good:#0F8A4F;--bad:#D6293E;--warn:#C2610C;--navy:#0B1B3A;--on-accent:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#080E22;--soft:#0F1736;--surface:#121B3F;--ink:#EEF2FF;--muted:#9AA8CC;--line:#222E5C;--accent:#8B8CFF;--accent-soft:#1B2252;--teal:#2DD4BF;--good:#4ADE80;--bad:#FF6B7D;--warn:#FBBF24;--navy:#060B1D;--on-accent:#0B1020}}
:root[data-theme="dark"]{--bg:#080E22;--soft:#0F1736;--surface:#121B3F;--ink:#EEF2FF;--muted:#9AA8CC;--line:#222E5C;--accent:#8B8CFF;--accent-soft:#1B2252;--teal:#2DD4BF;--good:#4ADE80;--bad:#FF6B7D;--warn:#FBBF24;--navy:#060B1D;--on-accent:#0B1020}
body::before{background:var(--navy)}
header{background:var(--navy);border-bottom:0}
.brand{color:#fff}.brand span{color:#2DD4BF}
nav button{color:#AEBBE0}nav button:hover{color:#fff}
nav button[aria-current="true"]{color:#fff;background:rgba(255,255,255,.14)}
.xp{background:rgba(255,255,255,.14);color:#fff}
.btn{color:var(--on-accent)}
main{padding-top:24px}
.banner{background:radial-gradient(800px 300px at 90% -10%,rgba(45,212,191,.4),transparent 60%),linear-gradient(135deg,#0B1B3A,#2D2BA8);color:#fff;border-radius:22px;padding:44px 34px 84px}
.banner h1{font-size:clamp(32px,6vw,50px);letter-spacing:-.035em;line-height:1.08;max-width:16ch}
.banner p{color:#C9D4F5;font-size:18px;max-width:52ch;margin:14px 0 22px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.09);border-radius:20px;padding:4px 14px;font-size:14px}
.pwp{margin:-52px 14px 0;position:relative;box-shadow:0 14px 34px rgba(11,27,58,.2)}
.mgrid,.threats{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.mod{border:1px solid var(--line);border-top:4px solid var(--c);border-radius:14px;background:var(--surface)}
.mod:last-child{border-bottom:1px solid var(--line)}
.mod.open{grid-column:1/-1}
.mod:nth-child(1){--c:#4F46E5}.mod:nth-child(2){--c:#E11D48}.mod:nth-child(3){--c:#D97706}.mod:nth-child(4){--c:#0D9488}.mod:nth-child(5){--c:#7C3AED}.mod:nth-child(6){--c:#0284C7}
.mod>button{padding:18px}
.ico{display:flex;width:40px;height:40px;align-items:center;justify-content:center;border-radius:10px;background:color-mix(in srgb,var(--c) 15%,transparent);font-size:20px;flex:none}
.body{padding:0 18px 20px;max-width:none}
.tc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.tc .k{display:inline-block;font-size:12px;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);border-radius:20px;padding:2px 10px;margin-bottom:10px}
.tc h3{font-size:18px;margin-bottom:6px}.tc p{margin:0 0 12px;color:var(--muted);font-size:15px}
.tc .d{font-size:14px;background:var(--soft);border-radius:10px;padding:10px 12px}
.ck{display:flex;gap:12px;align-items:center;width:100%;text-align:left;font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer}
.ck::before{content:"";width:18px;height:18px;border-radius:5px;border:2px solid var(--line);flex:none}
.ck.on{border-color:var(--teal)}.ck.on::before{background:var(--teal);border-color:var(--teal);box-shadow:inset 0 0 0 3px var(--surface)}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin:10px 0}
summary{cursor:pointer;font-weight:600}details p{color:var(--muted);margin:10px 0 0}
.opt{overflow-wrap:anywhere}
.stat,.badge{background:var(--surface)}.stat{border-top:3px solid var(--accent)}
.panel .prog{margin-top:0}
footer{margin-top:20px;border-top:1px solid var(--line);padding-top:20px}
.fcs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}
.fc{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:20px;padding:6px 16px;cursor:pointer}
.fc[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.news{display:grid;gap:16px}
.nc{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:14px;padding:20px 22px}
.nc.sev-High{--c:var(--bad)}.nc.sev-Medium{--c:var(--warn)}.nc.sev-Ongoing{--c:var(--accent)}
.nh{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px;font-size:13px}
.sv{font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);padding:2px 10px;border-radius:20px}
.nd{color:var(--muted)}
.nc h3{font-size:20px;margin-bottom:8px}.nc p{margin:0 0 10px;color:var(--muted);font-size:15px}.nc p.who{color:var(--ink)}
.do{background:var(--soft);border-radius:10px;padding:12px 16px;margin:12px 0;font-size:15px}
.do ul{margin:6px 0 0;padding-left:20px}.do li{margin:4px 0}
.nf{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:14px}
.nf a{color:var(--accent)}.nf .btn{padding:7px 14px;font-size:14px}
.nf .btn:disabled{opacity:1;color:var(--good);border-color:var(--good)}
a.btn{text-decoration:none;display:inline-block}
.abar{background:#B4172B;color:#fff}
.ain{max-width:820px;margin:auto;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:15px}
.ab{display:flex;gap:8px}
.abar button{font:inherit;font-size:14px;border:1px solid rgba(255,255,255,.65);background:transparent;color:#fff;border-radius:8px;padding:4px 12px;cursor:pointer}
.abar button:hover{background:rgba(255,255,255,.15)}
.bd{background:#B4172B;color:#fff;border-radius:10px;font-size:11px;padding:1px 7px;margin-left:6px;font-weight:600}
.nc.al-Critical{--c:var(--bad)}.nc.al-High{--c:var(--warn)}
.tier{font-size:12px;font-weight:600;color:var(--good);border:1px solid color-mix(in srgb,var(--good) 45%,transparent);border-radius:20px;padding:1px 10px;margin-left:4px}
.vl{margin:0;padding-left:20px}.vl li{margin:8px 0}
.held{border:1px dashed var(--line);border-radius:12px;padding:12px 16px;margin:10px 0;font-size:15px;color:var(--muted)}
.held b{color:var(--ink)}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;display:flex;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.steps li:first-child{border-top:0;padding-top:0}.steps li:last-child{padding-bottom:0}
.steps li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:600;font-size:14px}
.linkb{font:inherit;font-size:14px;background:none;border:0;color:var(--accent);cursor:pointer;padding:0;text-decoration:underline}
.scb{font:inherit;text-align:left;cursor:pointer;color:var(--ink);width:100%}.scb:hover{border-color:var(--accent)}
.hi{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}.hx{display:block;margin-top:10px;font-size:12px;word-break:break-all;color:var(--muted)}code{background:var(--soft);padding:1px 6px;border-radius:5px;font-size:.9em}
pre.art{background:var(--soft);border-radius:10px;padding:12px 14px;overflow-x:auto;font-size:13px;line-height:1.5;margin:0 0 14px}
.body h4{margin:14px 0 4px;font-size:15px}



/* ==========================================================================
   CYBERAWARE PHISHING GAMELAB: FORENSIC INVESTIGATOR & DOMAIN DISSECTOR
   ========================================================================== */
.gl-container { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 24px; margin-bottom: 32px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
.gl-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.gl-title { font-size: 24px; font-weight: 700; color: var(--ink); margin: 0; }
.gl-sub { color: var(--muted); font-size: 14.5px; margin: 4px 0 0; max-width: 65ch; }
.gl-nav { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; border-bottom: 1px solid var(--line); padding-bottom: 14px; }
.gl-tab { font: inherit; font-size: 13.5px; font-weight: 600; border: 1px solid var(--line); background: var(--soft); color: var(--muted); border-radius: 10px; padding: 8px 16px; cursor: pointer; transition: all .15s; }
.gl-tab:hover { color: var(--ink); border-color: var(--accent); }
.gl-tab.active { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.gl-badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
.gl-badge-warn { background: rgba(245,158,11,0.15); color: #d97706; }
.gl-badge-danger { background: rgba(239,68,68,0.15); color: #dc2626; }
.gl-badge-good { background: rgba(16,185,129,0.15); color: #059669; }

/* Interactive Email Client Mockup */
.gl-client { border: 1px solid var(--line); border-radius: 14px; background: var(--bg); overflow: hidden; margin-top: 14px; }
.gl-client-top { background: var(--soft); padding: 12px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; font-size: 13px; color: var(--muted); }
.gl-client-meta { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.gl-client-body { padding: 22px; font-size: 15px; line-height: 1.65; color: var(--ink); }
.gl-flag-btn { border: 1px dashed var(--line); border-radius: 6px; padding: 2px 8px; cursor: pointer; background: transparent; font: inherit; color: inherit; transition: all .2s; display: inline-block; text-align: left; }
.gl-flag-btn:hover { border-color: var(--warn); background: rgba(245,158,11,0.15); }
.gl-flag-btn.found { border: 1px solid var(--bad); background: rgba(239,68,68,0.15); color: var(--bad); font-weight: 600; text-decoration: underline wavy; }
.gl-clue-card { border-left: 4px solid var(--bad); background: var(--soft); border-radius: 10px; padding: 14px 18px; margin: 12px 0; font-size: 14px; animation: glFadeIn .3s ease; }
@keyframes glFadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

/* URL Dissector */
.gl-dissector-wrap { display: flex; flex-direction: column; gap: 14px; }
.gl-url-parts { display: flex; flex-wrap: wrap; gap: 4px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 15px; padding: 14px; background: var(--soft); border-radius: 12px; border: 1px solid var(--line); align-items: center; }
.gl-part { padding: 4px 8px; border-radius: 6px; }
.gl-part-proto { background: rgba(16,185,129,0.18); color: #059669; }
.gl-part-sub { background: rgba(245,158,11,0.18); color: #d97706; }
.gl-part-domain { background: rgba(239,68,68,0.22); color: #dc2626; font-weight: bold; border: 1px solid #dc2626; }
.gl-part-path { background: rgba(100,116,139,0.18); color: var(--muted); }

/* Smartphone Smishing Shell */
.gl-phone { max-width: 380px; margin: 10px auto; border: 3px solid var(--line); border-radius: 28px; padding: 18px 16px; background: var(--bg); box-shadow: 0 12px 30px rgba(0,0,0,0.15); }
.gl-phone-notch { width: 120px; height: 16px; background: var(--line); border-radius: 10px; margin: 0 auto 16px; }
.gl-sms-bubble { background: var(--soft); border-radius: 16px 16px 16px 4px; padding: 14px 16px; font-size: 14px; margin-bottom: 14px; border: 1px solid var(--line); line-height: 1.55; }


/* ==========================================================================
   LEVEL 3: PROFESSIONAL SECURITY OPERATIONS LAB GUI
   ========================================================================== */
.sl-wrap { margin-top: 64px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 26px; box-shadow: 0 6px 24px rgba(0,0,0,0.06); }
.sl-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 18px; margin-bottom: 22px; }
.sl-pills { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.sl-pill { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; padding: 3px 10px; border-radius: 20px; background: rgba(13,148,136,0.14); color: #0d9488; border: 1px solid rgba(13,148,136,0.3); }
.sl-pill-sec { background: rgba(59,130,246,0.14); color: #3b82f6; border-color: rgba(59,130,246,0.3); }
.sl-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.sl-card { text-align: left; font: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 20px; cursor: pointer; transition: all .2s ease; display: flex; flex-direction: column; justify-content: space-between; gap: 12px; position: relative; overflow: hidden; }
.sl-card:hover { border-color: #0d9488; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(13,148,136,0.12); }
.sl-card-top { display: flex; justify-content: space-between; align-items: center; width: 100%; }
.sl-id { font-family: ui-monospace, monospace; font-size: 11.5px; font-weight: 700; color: var(--muted); background: var(--soft); padding: 2px 8px; border-radius: 6px; }

/* Layout & Root Adjustments */

  font-size: 11.5px;
  font-weight: 600;
  width: 100%;
  padding: 6px 10px;
  border-radius: 8px;
  border: 1px dashed var(--accent);
  background: var(--accent-soft);
  color: var(--accent);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all 0.15s ease;
}

.sidebar-demo-toggle-btn:hover {
  filter: brightness(1.1);
  transform: translateY(-1px);
}

/* Main Content Area */
main#app {
  flex: 1;
  min-width: 0;
  max-width: 920px;
  margin: 0 auto;
  padding: 40px 24px 80px;
  transition: max-width var(--trans-base);
}

.sidebar-collapsed main#app {
  max-width: 1040px;
}

/* ==========================================================================
   MOBILE NAVIGATION DRAWER
   ========================================================================== */
.drawer-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(8, 14, 34, 0.7);
  backdrop-filter: blur(6px);
  z-index: 200;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
}

.drawer-backdrop.open {
  opacity: 1;
  pointer-events: auto;
}

aside#mobile-drawer {
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  width: min(340px, 86vw);
  background: var(--surface);
  color: var(--ink);
  box-shadow: 10px 0 30px rgba(0, 0, 0, 0.3);
  z-index: 210;
  transform: translateX(-100%);
  transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

aside#mobile-drawer.open {
  transform: translateX(0);
}

.drawer-header {
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--header-bg);
  border-bottom: 1px solid var(--header-border);
}

.drawer-header .brand {
  font-size: 18px;
}

.drawer-close-btn {
  font: inherit;
  width: 36px;
  height: 36px;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.1);
  border: 0;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.15s ease;
}

.drawer-close-btn:hover {
  background: rgba(255, 255, 255, 0.2);
}

.drawer-user-card {
  padding: 12px 20px;
  background: var(--soft);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 13px;
  font-weight: 600;
}

.drawer-body {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 16px 14px;
}

.drawer-footer {
  padding: 14px 20px;
  border-top: 1px solid var(--line);
  background: var(--soft);
}

.drawer-emergency-link {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: #D6293E;
  color: #fff;
  font-size: 13.5px;
  font-weight: 600;
  padding: 10px 14px;
  border-radius: 8px;
  text-decoration: none;
  transition: all 0.16s ease;
}

.drawer-emergency-link:hover {
  filter: brightness(1.1);
}

/* Responsive Media Queries */
@media (max-width: 980px) {
  .desktop-nav {
    display: none;
  }
  aside#desktop-sidebar {
    display: none;
  }
  #sidebar-restore-btn {
    display: none !important;
  }
  .hamburger-btn {
    display: flex;
  }
  .header-actions .emergency-quick-btn {
    display: none;
  }
  main#app {
    padding: 32px 16px 64px;
  }
}

@media (max-width: 600px) {
  .header-inner {
    padding: 0 14px;
  }
  .brand-text {
    font-size: 18px;
  }
  .brand-badge {
    display: none;
  }
  .xp-badge-nav {
    font-size: 12px;
    padding: 3px 9px;
  }
}

/* Helper to navigate smoothly to a view and perform an action */
function navTo(targetView, action = null) {
  closeMegaMenu();
  closeMobileDrawer();
  
  if (targetView && typeof targetView === "string") {
    view = targetView;
  }
  
  // Set expanded accordion in sidebar
  if (expandedAccordions.hasOwnProperty(view)) {
    expandedAccordions[view] = true;
  }
  
  // If specific action:
  if (action) {
    if (action.type === "mod") {
      open = action.id;
    } else if (action.type === "quiz-start") {
      qz = { i: 0, s: 0, a: null };
    } else if (action.type === "health-start") {
      hc = { i: 0, ans: [] };
    } else if (action.type === "filter-news") {
      nf = action.filter;
    } else if (action.type === "help-step") {
      hs = action.index;
    } else if (action.type === "track") {
      open4 = action.id;
    } else if (action.type === "open-lab") {
      ch = { i: action.index, qi: 0, a: null, s: 0 };
    } else if (action.type === "gamelab") {
      glTab = action.tab || "inspect";
    }
  }
  
  render();
  
  // Smooth scroll or focus if requested
  setTimeout(() => {
    if (action) {
      if (action.type === "mod" && action.id) {
        const el = document.querySelector(`[data-m="${action.id}"]`);
        if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
      } else if (action.type === "focus-pw") {
        const inp = document.getElementById("pw");
        if (inp) {
          inp.scrollIntoView({ behavior: "smooth", block: "center" });
          inp.focus();
        }
      } else if (action.type === "open-lab") {
        const el = document.querySelector(".sl-wrap");
        if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
      } else if (action.type === "gamelab") {
        const el = document.querySelector(".gl-container");
        if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
      } else if (action.type === "scroll" && action.id) {
        const el = document.getElementById(action.id);
        if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
      } else {
        scrollTo({ top: 0, behavior: "smooth" });
      }
    } else {
      scrollTo({ top: 0, behavior: "smooth" });
    }
  }, 80);
}

/* ==========================================================================
   RENDER MEGA MENU (DESKTOP)
   ========================================================================== */
function renderDesktopMegaNav() {
  const container = document.getElementById("desktop-mega-nav");
  if (!container) return;
  
  let html = "";
  NAV_CONFIG.forEach(item => {
    const isActive = view === item.view;
    const hasSubmenu = !!item.megaMenu;
    const isMenuOpen = activeMegaMenu === item.id;
    const unread = item.id === "updates" && typeof unack === "function" ? unack() : 0;
    
    html += `
      <div class="nav-item-wrapper" data-nav-id="${item.id}">
        <button class="nav-link-btn" 
                data-target-view="${item.view}" 
                data-menu-id="${item.id}"
                aria-haspopup="${hasSubmenu ? 'true' : 'false'}"
                aria-expanded="${isMenuOpen ? 'true' : 'false'}"
                aria-current="${isActive ? 'true' : 'false'}">
          ${ico(item.icon, 16)}
          <span>${item.label}</span>
          ${unread ? `<span class="nav-badge-pill">${unread}</span>` : ""}
          ${hasSubmenu ? `<span class="nav-chevron" title="Open ${item.label} Menu">${ico("chevron-down", 14)}</span>` : ""}
        </button>
        ${hasSubmenu ? renderMegaDropdownPanel(item, isMenuOpen) : ""}
      </div>
    `;
  });
  
  container.innerHTML = html;
  
  // Attach event handlers for Direct Click Navigation (hover popups removed)
  container.querySelectorAll(".nav-item-wrapper").forEach(wrapper => {
    const navId = wrapper.dataset.navId;
    const btn = wrapper.querySelector(".nav-link-btn");
    const cfg = NAV_CONFIG.find(c => c.id === navId);
    
    if (cfg) {
      // Click handler: DIRECT NAVIGATION TO THE VIEW!
      btn.addEventListener("click", (e) => {
        // If clicking specifically on the chevron icon, toggle menu
        if (e.target.closest(".nav-chevron")) {
          e.preventDefault();
          e.stopPropagation();
          if (activeMegaMenu === navId) {
            closeMegaMenu();
          } else {
            openMegaMenu(navId);
          }
          return;
        }
        
        // Otherwise direct click navigates to page immediately!
        e.preventDefault();
        e.stopPropagation();
        closeMegaMenu();
        navTo(cfg.view);
      });
    }
  });
}

function openMegaMenu(menuId) {
  activeMegaMenu = menuId;
  const container = document.getElementById("desktop-mega-nav");
  if (!container) return;
  
  container.querySelectorAll(".nav-item-wrapper").forEach(wrap => {
    const id = wrap.dataset.navId;
    const btn = wrap.querySelector(".nav-link-btn");
    const panel = wrap.querySelector(".mega-dropdown-panel");
    const isThis = id === menuId;
    
    btn.setAttribute("aria-expanded", isThis ? "true" : "false");
    if (panel) {
      panel.classList.toggle("open", isThis);
    }
  });
  
  // Attach click listeners to submenu items inside opened panel
  const activePanel = container.querySelector(`[data-nav-id="${menuId}"] .mega-dropdown-panel`);
  if (activePanel) {
    activePanel.querySelectorAll("[data-action]").forEach(b => {
      b.onclick = (e) => {
        e.preventDefault();
        e.stopPropagation();
        const v = b.dataset.view;
        let act = {};
        try { act = JSON.parse(b.dataset.action || "{}"); } catch(err){}
        closeMegaMenu();
        navTo(v, act);
      };
    });
  }
}

function closeMegaMenu() {
  activeMegaMenu = null;
  const container = document.getElementById("desktop-mega-nav");
  if (!container) return;
  container.querySelectorAll(".nav-item-wrapper").forEach(wrap => {

function actionMatchesActive(sub) {
  if (view !== sub.view) return false;
  if (!sub.action) return false;
  if (sub.action.type === "mod" && open === sub.action.id) return true;
  if (sub.action.type === "filter-news" && nf === sub.action.filter) return true;
  if (sub.action.type === "help-step" && hs === sub.action.index) return true;
  return false;
}

function openMobileDrawer() {

}

function closeMobileDrawer() {
  const drawer = document.getElementById("mobile-drawer");
  const backdrop = document.getElementById("mobile-drawer-backdrop");
  const btn = document.getElementById("mobile-menu-btn");
  if (drawer) drawer.classList.remove("open");

/* ==========================================================================
   SIDEBAR TOGGLE & THEME TOGGLE
   ========================================================================== */
function toggleSidebar() {
  sidebarCollapsed = !sidebarCollapsed;
  applySidebarState();
  try {
    localStorage.setItem("cyberaware_sidebar", sidebarCollapsed ? "true" : "false");
  } catch(e) {}
}

function applySidebarState() {
  const wrapper = document.getElementById("site-wrapper");
  if (wrapper) {
    wrapper.classList.toggle("sidebar-collapsed", sidebarCollapsed);
  }
}

function toggleTheme() {
  const root = document.documentElement;
  const current = root.getAttribute("data-theme") || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const next = current === "dark" ? "light" : "dark";
  root.setAttribute("data-theme", next);
  try {
    localStorage.setItem("cyberaware_theme", next);
  } catch(e) {}
  updateThemeIcon();
}

function updateThemeIcon() {
  const btn = document.getElementById("theme-toggle-btn");
  if (!btn) return;
  const isDark = document.documentElement.getAttribute("data-theme") === "dark" || 
                 (!document.documentElement.getAttribute("data-theme") && window.matchMedia("(prefers-color-scheme: dark)").matches);
  btn.innerHTML = ico(isDark ? "sun" : "moon", 18);
  btn.setAttribute("title", isDark ? "Switch to Light Mode" : "Switch to Dark Mode");
}

/* Centralized Nav UI Update Callback */
function updateNavUI() {
  renderDesktopMegaNav();
  renderSidebarAccordion();
  renderMobileDrawer();
}

/* ==========================================================================
   GLOBAL EVENT LISTENERS (CLICK OUTSIDE, ESCAPE, KEYBOARD NAV, INITIALIZATION)
   ========================================================================== */
document.addEventListener("DOMContentLoaded", () => {
  // Initialize Theme
  try {
    const savedTheme = localStorage.getItem("cyberaware_theme");
    if (savedTheme) {
      document.documentElement.setAttribute("data-theme", savedTheme);
    }
  } catch(e) {}
  updateThemeIcon();
  
  // Apply saved sidebar state
  applySidebarState();
  
  // Close mega menu when clicking outside
  document.addEventListener("click", (e) => {
    if (!e.target.closest("#desktop-mega-nav") && activeMegaMenu) {
      closeMegaMenu();
    }
  });
  
  // Escape key closes mega menu and mobile drawer
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      closeMegaMenu();
      closeMobileDrawer();
    }
  });
  
  // Mobile drawer triggers
  const mobBtn = document.getElementById("mobile-menu-btn");
  if (mobBtn) {
    mobBtn.onclick = () => openMobileDrawer();
  }
  
  const drawerCloseBtn = document.getElementById("mobile-drawer-close");
  if (drawerCloseBtn) {
    drawerCloseBtn.onclick = () => closeMobileDrawer();
  }
  
  const backdrop = document.getElementById("mobile-drawer-backdrop");
  if (backdrop) {
    backdrop.onclick = () => closeMobileDrawer();
  }
  
  // Sidebar collapse & restore triggers
  const collapseBtn = document.getElementById("sidebar-collapse-btn");
  if (collapseBtn) {
    collapseBtn.onclick = () => toggleSidebar();
  }
  
  const restoreBtn = document.getElementById("sidebar-restore-btn");
  if (restoreBtn) {
    restoreBtn.onclick = () => toggleSidebar();
  }
  
  // Theme button
  const themeBtn = document.getElementById("theme-toggle-btn");
  if (themeBtn) {
    themeBtn.onclick = () => toggleTheme();
  }
  
  // Header emergency button
  const emBtn = document.getElementById("header-emergency-btn");
  if (emBtn) {
    emBtn.onclick = () => navTo("help");
  }
  
  // Initial render
  updateNavUI();
});

function dissectURL(inputUrl) {
  try {
    const parsed = new URL(inputUrl.startsWith("http") ? inputUrl : "https://" + inputUrl);
    const host = parsed.hostname;
    const parts = host.split(".");
    let domain = host;
    let sub = "";
    if (parts.length >= 2) {
      if (parts.length > 2 && (parts[parts.length-2] === "co" || parts[parts.length-2] === "gov" || parts[parts.length-2] === "ac" || parts[parts.length-2] === "edu")) {
        domain = parts.slice(-3).join(".");
        sub = parts.slice(0, -3).join(".");
      } else {
        domain = parts.slice(-2).join(".");
        sub = parts.slice(0, -2).join(".");
      }
    }
    return {
      proto: parsed.protocol + "//",
      sub: sub ? sub + "." : "",
      domain: domain,
      path: parsed.pathname + parsed.search,
      isHttps: parsed.protocol === "https:"
    };
  } catch(e) {
    return { proto: "http://", sub: "", domain: inputUrl, path: "", isHttps: false };
  }
}
